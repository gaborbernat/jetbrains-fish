name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notes:
    name: Verify tagged source
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      previous: ${{ steps.tag.outputs.previous }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Verify tag and select previous release
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          git tag --list | release-creator tags "$TAG"
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          previous=$(git tag --list | release-creator tags "$TAG" --previous)
          echo "previous=$previous" >>"$GITHUB_OUTPUT"
  contributors:
    needs: notes
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    environment: release
    steps:
      - name: Fetch contributor metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.notes.outputs.previous }}
        run: |
          set -euo pipefail
          args=(-f "tag_name=$TAG")
          if [[ -n "$PREVIOUS" ]]; then args+=(-f "previous_tag_name=$PREVIOUS"); fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body \
            >"$RUNNER_TEMP/generated-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-notes
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  release-notes:
    needs: contributors
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-notes
          path: ${{ runner.temp }}
      - uses: tox-dev/github-workflows/render-release-notes@6b0b2bfde5fa9d38dcf41b3f1141f89d8fb44c56
        with:
          tag: ${{ github.ref_name }}
          changelog: CHANGELOG.md
          repository: ${{ github.repository }}
          artifact-url: https://plugins.jetbrains.com/plugin/29973-fish-shell
          artifact-label: JetBrains Marketplace
          generated-notes: ${{ runner.temp }}/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  build-signed:
    name: Build and verify signed plugin
    needs: notes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      archive_sha: ${{ steps.archive.outputs.sha }}
      archive_name: ${{ steps.archive.outputs.name }}
    environment:
      name: release
      url: https://plugins.jetbrains.com/plugin/29973-fish-shell
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🧹 Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - name: 🔧 Set up mise (JDKs)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          cache-disabled: true
      - name: 🏷️ Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: sed -i "s/^pluginVersion=.*/pluginVersion=${TAG#v}/" gradle.properties
      - name: Build signed plugin ZIP
        env:
          CERTIFICATE_CHAIN: ${{ vars.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin
      - name: Verify plugin structure and signature
        env:
          CERTIFICATE_CHAIN: ${{ vars.CERTIFICATE_CHAIN }}
        run: ./gradlew verifyPluginStructure verifyPluginSignature
      - name: Check signed ZIP and plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archives=(build/distributions/*-"${TAG#v}"-signed.zip)
          test "${#archives[@]}" -eq 1
          test -f "${archives[0]}"
          unzip -tq "${archives[0]}" >/dev/null
          unzip -p "${archives[0]}" "*/lib/*-${TAG#v}.jar" >"$RUNNER_TEMP/plugin.jar"
          unzip -p "$RUNNER_TEMP/plugin.jar" META-INF/plugin.xml >"$RUNNER_TEMP/plugin.xml"
          grep -Fq "<version>${TAG#v}</version>" "$RUNNER_TEMP/plugin.xml"
      - name: Record signed ZIP digest
        id: archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          archives=(build/distributions/*-"${TAG#v}"-signed.zip)
          test "${#archives[@]}" -eq 1
          read -r digest _ < <(sha256sum "${archives[0]}")
          echo "sha=$digest" >>"$GITHUB_OUTPUT"
          echo "name=${archives[0]##*/}" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-distribution
          path: build/distributions/*-signed.zip
          if-no-files-found: error
  marketplace-check:
    name: Check Marketplace version
    needs: build-signed
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.marketplace.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-distribution
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Check signed ZIP digest
        env:
          EXPECTED_SHA: ${{ needs.build-signed.outputs.archive_sha }}
        run: |
          archives=(dist/*-signed.zip)
          test "${#archives[@]}" -eq 1
          test "$(sha256sum "${archives[0]}" | cut -d' ' -f1)" = "$EXPECTED_SHA"
      - name: Compare Marketplace member bytes
        id: marketplace
        env:
          TAG: ${{ github.ref_name }}
        run: release-creator marketplace --plugin-id com.github.toxdev.fish --version "${TAG#v}" --archive dist/*-signed.zip --mode stage --github-output "$GITHUB_OUTPUT"
  marketplace-publish:
    name: Upload to JetBrains Marketplace
    needs: [build-signed, marketplace-check]
    if: needs.marketplace-check.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-distribution
          path: dist
      - uses: tox-dev/github-workflows/publish-jetbrains-marketplace@6a57fbaf8fbb009452f63af068a0c5e3dde81db4
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        with:
          archive: dist/${{ needs.build-signed.outputs.archive_name }}
          sha256: ${{ needs.build-signed.outputs.archive_sha }}
          plugin-id: "29973"
          channel: ""
  marketplace-verify:
    name: Verify Marketplace version
    needs: [build-signed, marketplace-check, marketplace-publish]
    if: always() && needs.marketplace-check.result == 'success' && (needs.marketplace-publish.result == 'success' || needs.marketplace-publish.result == 'skipped')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-distribution
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Check signed ZIP digest
        env:
          EXPECTED_SHA: ${{ needs.build-signed.outputs.archive_sha }}
        run: |
          archives=(dist/*-signed.zip)
          test "${#archives[@]}" -eq 1
          test "$(sha256sum "${archives[0]}" | cut -d' ' -f1)" = "$EXPECTED_SHA"
      - name: Verify published member bytes
        env:
          TAG: ${{ github.ref_name }}
        run: release-creator marketplace --plugin-id com.github.toxdev.fish --version "${TAG#v}" --archive dist/*-signed.zip --mode verify
  github-release:
    needs: [notes, build-signed, release-notes, marketplace-verify]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-distribution
          path: dist/
      - name: Check downloaded plugin ZIP
        env:
          EXPECTED_SHA: ${{ needs.build-signed.outputs.archive_sha }}
        run: |
          archives=(dist/*-signed.zip)
          test "${#archives[@]}" -eq 1
          unzip -tq "${archives[0]}" >/dev/null
          read -r digest _ < <(sha256sum "${archives[0]}")
          test "$digest" = "$EXPECTED_SHA"
      - uses: tox-dev/github-workflows/publish-github-release@6b0b2bfde5fa9d38dcf41b3f1141f89d8fb44c56
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          commit: ${{ needs.notes.outputs.commit }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
          assets-directory: dist
  post-release:
    name: 📝 Post-release version bump
    needs: github-release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    environment: release-auth
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] this job pushes its post-release branch
      - name: 📝 Create post-release PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          IFS='.' read -r major minor patch <<<"$version"
          next_version="$major.$minor.$((patch + 1))-dev"
          branch="post-release-$TAG"
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -b "$branch" origin/main
          sed -i "s/^pluginVersion=.*/pluginVersion=$next_version/" gradle.properties
          git add gradle.properties
          git commit -m "Bump version to $next_version after $TAG"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "Bump version to $next_version" \
            --body "Set the next development version after $TAG." \
            --head "$branch" \
            --label 'skip news'
